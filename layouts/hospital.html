<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: white;
            color: rgb(2, 1, 1);
            margin: 0;
            padding: 0;
        }

        .main {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;

            width: 100%;
            height: auto;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn-card {
            position: relative;
            display: flex;
            gap: 10px;
        }

        .btn-submit {
            width: 100px;
            height: 40px;
            margin-top: 10px;
            color: white;
            background-color: rgb(5, 92, 192);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-submit-clear {
            width: 100px;
            height: 40px;
            margin-top: 10px;
            color: white;
            background-color: rgb(5, 192, 8);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .active {
            display: none;
        }

        .popup {
            background-color: #222;
            color: white;
            border: 2px solid salmon;
            border-radius: 8px;
            box-shadow: 5px 5px 10px #c0c0c0;
            text-align: center;

            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;

            padding: 10px;
            width: 100%;
            height: 100px;

            z-index: 10;
        }

        .popup h4 {
            margin: 0;
            text-align: center;
            color: salmon;
        }

        .popup .closed {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1 id="title">Hello, Welcome to Hospital!</h1>
        <h2 id="sub-title">Please register for new patient</h2>

        <div class="sub-main">
            <form class="form" action="" method="get">
                <label for="">Full Name</label>
                <input type="text" class="form-input name" placeholder="jhon doe">
                <label for="">Age</label>
                <input type="number" class="form-input age" placeholder="xx">
                <div class="btn-card">
                    <button id="add-field" type="button" class="btn-submit">+ add field</button>
                    <button id="clear-field" type="button" class="btn-submit-clear active">clear</button>
                </div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>
    </div>

    <script src="../javascript/hospital.js"></script>
</body>

</html>
